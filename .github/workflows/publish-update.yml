name: 测试并发布标镜更新

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装固定版本依赖
        run: python -m pip install -r requirements.txt
      - name: 验证 Windows 安装脚本
        if: runner.os == 'Windows'
        shell: powershell
        env:
          BIAOJING_PYTHON: python
        run: .\install_windows.ps1
      - name: 检查启动依赖
        run: python launch.py --check
      - name: 编译 Python 模块
        run: python -m compileall -q app
      - name: 运行自动化回归
        run: python -W error::ResourceWarning -m unittest discover -s app/biaojing/tests -t app

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: 生成源码更新包
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_update_bundle.py "$RELEASE_TAG"
      - name: 校验中文版本说明并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE=".github/release-notes/$RELEASE_TAG.md"
          test -f "$NOTES_FILE"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "标镜 $RELEASE_TAG" --notes-file "$NOTES_FILE" \
            "biaojing-source-$RELEASE_TAG.zip"
