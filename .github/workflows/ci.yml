name: 跨平台自动化回归

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装固定版本依赖
        run: python -m pip install -r requirements.txt
      - name: 验证 Windows 安装脚本
        if: runner.os == 'Windows'
        shell: powershell
        env:
          BIAOJING_PYTHON: python
        run: .\install_windows.ps1
      - name: 检查启动依赖
        run: python launch.py --check
      - name: 编译 Python 模块
        run: python -m compileall -q app
      - name: 运行自动化回归
        run: python -W error::ResourceWarning -m unittest discover -s app/biaojing/tests -t app
